
name: Build KasHarian APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kasharian-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil source
        uses: actions/checkout@v7

      - name: Siapkan Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v4

      - name: Siapkan Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Pasang Android API 36 dan Build Tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Siapkan kunci tanda tangan release
        env:
          KASHARIAN_KEYSTORE_BASE64: ${{ secrets.KASHARIAN_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KASHARIAN_KEYSTORE_BASE64:-}" ]; then
            echo "Secret KASHARIAN_KEYSTORE_BASE64 belum diisi."
            exit 1
          fi
          printf '%s' "$KASHARIAN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kasharian-release.jks"
          test -s "$RUNNER_TEMP/kasharian-release.jks"

      - name: Periksa source JavaScript
        run: bash scripts/check-web-assets.sh

      - name: Bangun APK release
        env:
          KASHARIAN_KEYSTORE_FILE: ${{ runner.temp }}/kasharian-release.jks
          KASHARIAN_KEYSTORE_PASSWORD: ${{ secrets.KASHARIAN_KEYSTORE_PASSWORD }}
          KASHARIAN_KEY_ALIAS: ${{ secrets.KASHARIAN_KEY_ALIAS }}
          KASHARIAN_KEY_PASSWORD: ${{ secrets.KASHARIAN_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verifikasi APK dan tanda tangan
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          OUT="app/build/outputs/apk/release/KasHarian-v1.0.1-release.apk"
          test -s "$APK"
          cp "$APK" "$OUT"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$OUT"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$OUT" > /tmp/kasharian-permissions.txt
          if grep -Eq 'android.permission.(INTERNET|ACCESS_NETWORK_STATE)|READ_GSERVICES' /tmp/kasharian-permissions.txt; then
            cat /tmp/kasharian-permissions.txt
            echo "Izin jaringan tidak boleh ada di APK."
            exit 1
          fi
          echo "APK release terverifikasi dan tidak meminta izin internet."

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: KasHarian-v1.0.1-release
          path: app/build/outputs/apk/release/KasHarian-v1.0.1-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Lampirkan APK ke GitHub Release saat ada tag v*
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/KasHarian-v1.0.1-release.apk
